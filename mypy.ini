[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
explicit_package_bases = True
disallow_untyped_defs = True
check_untyped_defs = true
disable_error_code = misc

exclude = 
    ^migrations/
    ^__pycache__/
    \.git/
    \.pytest_cache/
    \.mypy_cache/
    \.venv/
    ^build/
    ^lib/
    \.idea/
    \.vscode/
    \.ruff_cache/
